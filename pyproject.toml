[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lifeline-agent"
version = "0.1.0"
description = "AI-powered emergency dispatch system — Google ADK + Gemini 3.5 + Firebase"
readme = "my-agent/README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "LifeLine Agent Team" }]
keywords = ["ai", "agents", "emergency", "healthcare", "gemini", "adk", "firebase"]

dependencies = [
    # ── Google AI ─────────────────────────────────────────────────────────────
    "google-adk>=1.0.0",                 # Agent Development Kit
    "google-genai>=1.0.0",               # Gemini API (3.5-flash, 3.1-pro)
    "genkit>=0.9.0",                     # Google Genkit (flow/prompt management)

    # ── Firebase / GCP ────────────────────────────────────────────────────────
    "firebase-admin>=6.5.0",             # Firebase Admin SDK (Auth + Firestore)
    "google-cloud-firestore>=2.16.0",    # Firestore client

    # ── API / Web ─────────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # ── UI ────────────────────────────────────────────────────────────────────
    "streamlit>=1.40.0",

    # ── CLI ───────────────────────────────────────────────────────────────────
    "typer>=0.12.0",
    "rich>=13.9.0",

    # ── Data / Validation ─────────────────────────────────────────────────────
    "pydantic>=2.8.0",
    "requests>=2.32.0",

    # ── Security / Crypto ─────────────────────────────────────────────────────
    "cryptography>=43.0.0",              # Fernet AES-256 for config encryption
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",       # FastAPI test client
]

[project.scripts]
# Installs `lifeline` as a global CLI command after:  pip install -e .
# Also runnable as:  python -m lifeline
lifeline = "lifeline.cli:main"

[project.urls]
Repository = "https://github.com/your-org/lifeline-agent"
Documentation = "https://github.com/your-org/lifeline-agent/tree/main/my-agent"
"Bug Tracker" = "https://github.com/your-org/lifeline-agent/issues"

# ── Hatchling (build) ─────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["lifeline", "admin"]

# ── Ruff (linter) ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_level = "INFO"
